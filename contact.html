<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us · MCC Canteen</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="landing.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>

  <!-- ===================================================================
       HOW TO CHANGE THE CONTACT DETAILS: edit the 3 lines inside
       <div class="contact-info"> below (email, address, phone).
       =================================================================== -->

  <div class="page">

    <!-- ============ HEADER ============ -->
    <header class="header">
      <a href="landing.html" class="brand">
        <img class="brand-logo" src="img/logo.png" alt="Mabalacat City College logo">
        <span class="brand-name">MCC CANTEEN</span>
      </a>
      <nav class="nav">
        <a href="offers.html" class="nav-link">Offers</a>
        <a href="contact.html" class="nav-link active">Contact us</a>
        <a href="login.html" class="nav-link" data-auth-link="back">Login/Sign up</a>
      </nav>
    </header>

    <main class="page-main">
      <section class="stay">
        <h1>Stay Connected</h1>
        <p>Do you have questions, suggestions, or concerns? We’re here to help!</p>

        <div class="contact-card">
          <!-- ---------- the form (red side) ---------- -->
          <form class="contact-form" id="contactForm" novalidate>
            <label for="cName">Your name</label>
            <input id="cName" name="name" type="text" placeholder="name" maxlength="60" autocomplete="name">

            <label for="cEmail">Email address</label>
            <input id="cEmail" name="email" type="email" placeholder="email" maxlength="120" autocomplete="email">

            <label for="cSubject">Your subject</label>
            <input id="cSubject" name="subject" type="text" maxlength="100">

            <label for="cMessage">Message</label>
            <textarea id="cMessage" name="message" placeholder="Write your message here" maxlength="1000"></textarea>

            <button class="send" type="submit">Submit</button>
            <p class="form-msg" id="formMsg" role="status"></p>
          </form>

          <!-- ---------- the details (gray side) ---------- -->
          <div class="contact-info">
            <h2>Send Us Message</h2>
            <p>Tell us about your feedback or report about MCC Canteen</p>

            <div class="info-row">
              <i><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7L4.5 7v1.4L12 13.4l7.5-5V7z"/></svg></i>
              <span>mcccanteen@gmail.com</span>
            </div>
            <div class="info-row">
              <i><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></i>
              <span>Dolores, Mabalacat City, Pampanga.</span>
            </div>
            <div class="info-row">
              <i><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg></i>
              <span>09123344556</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="contact.js"></script>
</body>
</html>
