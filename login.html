<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · MCC Canteen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="auth.css?v=verify1">
</head>
<body>

  <!-- ===================================================================
       HOW TO CHANGE A PICTURE: edit only the link inside src="..."
         background photo -> img/login-bg.jpg   (put your own campus photo there)
         logo             -> img/mcc-canteen-logo.svg
       =================================================================== -->

  <!-- ============ RED BAR ============ -->
  <header class="topbar">
    <a href="landing.html" class="brand">
      <img class="brand-logo" src="img/mcc-canteen-logo.svg" alt="MCC Canteen logo">
      <span>MCC Canteen</span>
    </a>
  </header>

  <!-- ============ BACKGROUND + LOGIN CARD ============ -->
  <main class="stage">
    <img class="stage-bg" src="img/login-bg.jpg" alt="">

    <div class="card">
      <img class="card-logo" src="img/mcc-canteen-logo.svg" alt="">
      <h1>MCC Canteen</h1>

      <!-- Two pill buttons: login.js shows one form at a time -->
      <div class="tabs">
        <button class="tab active" id="tabLogin" type="button">Log in</button>
        <button class="tab" id="tabSignup" type="button">Sign up</button>
      </div>

      <!-- ---------- LOG IN ---------- -->
      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="loginEmail">Email or Number</label>
          <div class="input-wrap">
            <input id="loginEmail" type="text" name="email" placeholder="@gmail.com" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <input id="loginPassword" type="password" name="password" placeholder="password" autocomplete="current-password" required>
            <!-- The eye shows / hides the password (login.js) -->
            <button class="eye" type="button" aria-label="Show password"><img src="img/icons/eye.svg" alt=""></button>
          </div>
        </div>

        <a href="#" class="forgot" id="forgotLink">Forgot password?</a>

        <div class="form-bottom">
          <hr>
          <button class="submit" type="submit">Log in</button>
        </div>
      </form>

      <!-- ---------- SIGN UP ---------- -->
      <form id="signupForm" autocomplete="on" hidden>
        <div class="field">
          <label for="signupName">Full name</label>
          <div class="input-wrap">
            <input id="signupName" type="text" name="name" placeholder="name" maxlength="60" autocomplete="name" required>
          </div>
        </div>

        <div class="field">
          <label for="signupEmail">Email</label>
          <div class="input-wrap">
            <input id="signupEmail" type="email" name="email" placeholder="you@gmail.com" maxlength="120" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <div class="input-wrap">
            <input id="signupPassword" type="password" name="password" placeholder="min 8 characters" minlength="8" autocomplete="new-password" required>
            <button class="eye" type="button" aria-label="Show password"><img src="img/icons/eye.svg" alt=""></button>
          </div>
        </div>

        <div class="form-bottom">
          <hr>
          <button class="submit" type="submit">Create now</button>
        </div>
      </form>

      <!-- ---------- VERIFY EMAIL (shown after Sign up, or when a student logs in before verifying) ---------- -->
      <form id="verifyForm" autocomplete="off" hidden>
        <p class="verify-text">We sent a 6-digit code to<br><strong id="verifyEmail"></strong></p>

        <div class="field">
          <label for="verifyCode">Verification code</label>
          <div class="input-wrap">
            <input id="verifyCode" class="code-input" type="text" name="code" inputmode="numeric" pattern="[0-9]*"
                   maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
          </div>
        </div>

        <div class="verify-links">
          <button type="button" class="link-btn" id="resendBtn">Resend code</button>
          <button type="button" class="link-btn" id="verifyBack">Back</button>
        </div>

        <div class="form-bottom">
          <hr>
          <button class="submit" type="submit">Verify</button>
        </div>
      </form>

      <!-- Error messages appear here -->
      <p class="error" id="authError" role="alert"></p>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="login.js?v=verify1"></script>
</body>
</html>
