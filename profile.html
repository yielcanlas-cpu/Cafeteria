<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · MCC Canteen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Itim&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="profile.css">
</head>
<!-- "checking" hides the page until we know who is logged in. -->
<body class="checking">

  <!-- ============ RED TOP BAR ============ -->
  <header class="pf-bar">
    <!-- profile.js sets where this goes (student -> dashboard, staff -> staff page) -->
    <a href="index.html" class="pf-back" id="backLink"><img src="img/icons/arrow-left.svg" alt=""> Back to Home</a>

    <details class="pf-menu">
      <summary aria-label="Menu"><img src="img/icons/list.svg" alt=""></summary>
      <div class="pf-dropdown"><button type="button" id="logoutBtn">Log out</button></div>
    </details>
  </header>

  <main class="pf">
    <!-- ============ BANNER + AVATAR ============ -->
    <div class="pf-banner" id="banner">
      <button class="pf-photo-btn" type="button" data-photo="banner" aria-label="Change banner" hidden><img src="img/icons/edit.svg" alt=""></button>
    </div>

    <div class="pf-avatar-row">
      <div class="pf-avatar">
        <img id="avatarImg" src="img/avatar.svg" alt="Profile photo">
        <button class="pf-photo-btn" type="button" data-photo="avatar" aria-label="Change profile photo" hidden><img src="img/icons/edit.svg" alt=""></button>
      </div>
      <button class="pf-edit" id="editBtn" type="button">Edit profile</button>
    </div>

    <!-- ============ WHO YOU ARE (always shown) ============ -->
    <h1 class="pf-name" id="profileName">&nbsp;</h1>
    <p class="pf-email" id="email"></p>
    <p class="pf-bio" id="bio"></p>
    <p class="pf-meta">
      <span><img src="img/icons/pin.svg" alt=""> <span id="location"></span></span>
      <span><img src="img/icons/calendar.svg" alt=""> <span id="joined"></span></span>
    </p>
    <hr class="pf-line">

    <!-- ============ TABS (hidden while editing) ============ -->
    <section id="viewBox">
      <div class="pf-tabs" role="tablist">
        <button type="button" role="tab" class="on" data-tab="favorites">Favorites</button>
        <button type="button" role="tab" data-tab="orders">My orders</button>
      </div>
      <div id="tabBody"></div>
    </section>

    <!-- ============ EDIT FORM (shown after "Edit profile") ============ -->
    <form class="pf-form" id="editForm" hidden>
      <label>Name
        <input id="fName" maxlength="50" required>
        <small><span id="nameCount">0</span>/50</small>
      </label>

      <label>Bio
        <textarea id="fBio" maxlength="100" rows="3"></textarea>
        <small><span id="bioCount">0</span>/100</small>
      </label>

      <div class="pf-two">
        <label>Location
          <input id="fLocation" maxlength="80">
        </label>
        <label>Birthdate
          <input id="fBirthdate" type="date">
        </label>
      </div>

      <div class="pf-actions">
        <button class="pf-save" type="submit" id="saveBtn">Save</button>
        <button class="pf-cancel" type="button" id="cancelBtn">Cancel</button>
      </div>
    </form>

    <!-- hidden file picker used by both photo buttons -->
    <input type="file" id="photoInput" accept="image/*" hidden>
  </main>

  <script src="common.js"></script>
  <script src="profile-page.js"></script>
</body>
</html>
