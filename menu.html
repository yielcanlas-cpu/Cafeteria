<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <!-- Makes the page scale properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu · MCC Canteen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="common.css?v=3">
  <!-- landing.css has the header (the red bar) that this page shares with landing.html -->
  <link rel="stylesheet" href="landing.css?v=4">
  <link rel="stylesheet" href="menu.css?v=4">
  <link rel="stylesheet" href="pages.css?v=3">
</head>
<body>

  <!-- ===================================================================
       HOW TO CHANGE A FOOD PHOTO: edit only the link inside src="..."
         <img src="img/YOUR-PHOTO.jpg" alt="Name of the food">

       HOW TO ADD A FOOD: copy one <figure class="dish" data-cat="..."> ... </figure>
       block and paste it next to the others inside <div class="dish-grid">.
       data-cat must be one of: rice, meryenda, tusok, drinks
       (it decides which tab the food shows under).
       =================================================================== -->

  <div class="page">

    <!-- ============ HEADER: logo, search box, Back to Home ============ -->
    <header class="header">
      <a href="landing.html" class="brand">
        <img class="brand-logo" src="img/mcc_canteen_logo.png?v=2" alt="Mabalacat City College logo">
        <span class="brand-name">MCC CANTEEN</span>
      </a>
      <nav class="nav">
        <a href="offers.html" class="nav-link active">Offers</a>
        <a href="contact.html" class="nav-link">Contact us</a>
        <!-- common.js turns Login into a Back button once you are logged in; menu.js hides Sign up -->
        <a href="login.html" class="nav-link" data-auth-link="back">Login</a>
        <a href="login.html?tab=signup" class="nav-link" id="signupLink" data-auth-link="hide">Sign up</a>
      </nav>
    </header>

    <main class="menu-page">
     <div class="menu-main">
      <p class="menu-eyebrow">Menu</p>
      <h1 class="menu-heading">Browse our Menu</h1>

      <!-- ============ CATEGORY TABS ============ -->
      <nav class="menu-tabs" id="menuTabs">
        <button class="menu-tab active" data-cat="rice" type="button">Rice Meal</button>
        <button class="menu-tab" data-cat="meryenda" type="button">Meryenda</button>
        <button class="menu-tab" data-cat="tusok" type="button">Tusok-tusok</button>
        <button class="menu-tab" data-cat="drinks" type="button">Drinks</button>
      </nav>

      <!-- ============ THE FOODS (menu.js shows the ones for the chosen tab) ============ -->
      <div class="dish-grid" id="dishGrid">

        <!-- ---------- Rice Meal ---------- -->
        <figure class="dish" data-cat="rice">
          <img src="img/Crispy Pork Kare- Kare.jpg" alt="Kare-kare">
          <figcaption>Kare-kare</figcaption>
          <button class="order-btn" type="button" data-id="5">Order Now</button>
        </figure>
        <figure class="dish" data-cat="rice">
          <img src="img/sisig.jpg" alt="Sisig">
          <figcaption>Sisig</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="rice">
          <img src="img/bicol-express.jpg" alt="Bicol Express">
          <figcaption>Bicol Express</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="rice">
          <img src="img/sinigang.jpg" alt="Sinigang">
          <figcaption>Sinigang</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="rice">
          <img src="img/tinola.jpg" alt="Tinola">
          <figcaption>Tinola</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="rice">
          <img src="img/cheesy-chicken-katsu.jpg" alt="Cheesy Chicken Katsu">
          <figcaption>Cheesy Chicken Katsu</figcaption>
          <button class="order-btn" type="button" data-id="4">Order Now</button>
        </figure>
        <figure class="dish" data-cat="rice">
          <img src="img/pork-adobo.jpg" alt="Pork Adobo">
          <figcaption>Pork Adobo</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="rice">
          <img src="img/menudo.jpg" alt="Menudo">
          <figcaption>Menudo</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>

        <!-- ---------- Meryenda ---------- -->
        <figure class="dish" data-cat="meryenda" hidden>
          <img src="img/lumpiang-gulay.jpg" alt="Lumpiang Gulay">
          <figcaption>Lumpiang Gulay</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="meryenda" hidden>
          <img src="img/Turon(Banana Wrapped in Lumpia Wrapper).jpg" alt="Turon">
          <figcaption>Turon</figcaption>
          <button class="order-btn" type="button" data-id="2">Order Now</button>
        </figure>
        <figure class="dish" data-cat="meryenda" hidden>
          <img src="img/maruya.jpg" alt="Maruya">
          <figcaption>Maruya</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="meryenda" hidden>
          <img src="img/muffin.jpg" alt="Muffin">
          <figcaption>Muffin</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="meryenda" hidden>
          <img src="img/ham-and-cheese.jpg" alt="Ham &amp; Cheese">
          <figcaption>Ham &amp; Cheese</figcaption>
          <button class="order-btn" type="button" data-id="6">Order Now</button>
        </figure>
        <figure class="dish" data-cat="meryenda" hidden>
          <img src="img/cheese-stick.jpg" alt="Cheese Stick">
          <figcaption>Cheese Stick</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>

        <!-- ---------- Tusok-tusok ---------- -->
        <figure class="dish" data-cat="tusok" hidden>
          <img src="img/Kwek-kwek.jpg" alt="Kwek-kwek">
          <figcaption>Kwek-kwek</figcaption>
          <button class="order-btn" type="button" data-id="1">Order Now</button>
        </figure>
        <figure class="dish" data-cat="tusok" hidden>
          <img src="img/fried-isaw.jpg" alt="Fried isaw">
          <figcaption>Fried isaw</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="tusok" hidden>
          <img src="img/fried-tokwa.jpg" alt="Fried Tokwa">
          <figcaption>Fried Tokwa</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="tusok" hidden>
          <img src="img/fried-siomai.jpg" alt="Fried Siomai">
          <figcaption>Fried Siomai</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>

        <!-- ---------- Drinks ---------- -->
        <figure class="dish" data-cat="drinks" hidden>
          <img src="img/iced tea.jpg" alt="Iced Tea">
          <figcaption>Iced Tea</figcaption>
          <button class="order-btn" type="button" data-id="3">Order Now</button>
        </figure>
        <figure class="dish" data-cat="drinks" hidden>
          <img src="img/redtea.jpg" alt="Red Tea">
          <figcaption>Red Tea</figcaption>
          <button class="order-btn" type="button" data-id="7">Order Now</button>
        </figure>
        <figure class="dish" data-cat="drinks" hidden>
          <img src="img/sago at gulaman.jpg" alt="Gulaman">
          <figcaption>Gulaman</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>
        <figure class="dish" data-cat="drinks" hidden>
          <img src="img/melon.jpg" alt="Melon">
          <figcaption>Melon</figcaption>
          <button class="order-btn" type="button" disabled title="Not available for ordering yet">Order Now</button>
        </figure>

      </div>
     </div>

      <!-- ============ ORDER SUMMARY (right side). menu.js fills it and keeps it up to date ============ -->
      <aside class="order-summary" id="orderSummary">
        <h2 class="os-title">Order Summary <span id="osCount">(0)</span></h2>
        <ul class="os-items" id="osItems"></ul>
        <p class="os-empty" id="osEmpty">No items yet.<br>Tap Order Now on a food to add it.</p>

        <div class="os-bottom">
          <div class="os-fields">
            <input id="osRoom" type="text" placeholder="Deliver to room (e.g. MB 101)" maxlength="9" autocomplete="off" aria-label="Room">
            <select id="osFloor" aria-label="Floor"></select>   <!-- menu.js fills it from api.php -->
          </div>
          <div class="os-row"><span>Subtotal</span><span id="osSubtotal">Php0.00</span></div>
          <div class="os-row os-discount" id="osDiscountRow" hidden><span id="osDiscountLabel">First-order discount</span><span id="osDiscount">-Php0.00</span></div>
          <div class="os-row"><span>Delivery fee</span><span id="osFee">Php0.00</span></div>
          <div class="os-row os-total"><span>Grand total</span><span id="osTotal">Php0.00</span></div>
          <button class="os-confirm" id="osConfirm" type="button" disabled>Confirm Order</button>
        </div>
      </aside>
    </main>
  </div>

  <script src="common.js?v=3"></script>
  <script src="menu.js?v=6"></script>
</body>
</html>
