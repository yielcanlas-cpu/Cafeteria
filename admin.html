<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff · MCC Canteen</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="admin.css">
</head>
<!-- "checking" hides the page until we know the staff account is logged in -->
<body class="checking">

  <!-- ============ TOP BAR ============ -->
  <header class="bar">
    <a href="admin.html" class="brand">
      <img src="logo.png" alt="Mabalacat City College logo">
      <span>MCC CANTEEN <small>Staff</small></span>
    </a>
    <div class="bar-right">
      <span id="adminName"></span>
      <button class="bar-btn" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>

  <main class="wrap">

    <!-- ============ NUMBERS AT A GLANCE ============ -->
    <section class="stats">
      <div class="stat"><b id="countPreparing">0</b><span>Preparing</span></div>
      <div class="stat"><b id="countReady">0</b><span>Ready</span></div>
      <div class="stat"><b id="countDelivered">0</b><span>Delivered</span></div>
      <div class="stat"><b id="countCancelled">0</b><span>Cancelled</span></div>
      <div class="stat sales"><b id="salesToday">Php0.00</b><span>Sales today</span></div>
    </section>

    <!-- ============ TWO TABS: Orders | Messages ============ -->
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="orders" type="button">Orders</button>
      <button class="tab" data-tab="messages" type="button">Messages <span class="tab-count" id="msgCount" hidden>0</span></button>
    </nav>

    <div id="ordersTab">
    <!-- ============ FILTERS + SEARCH ============ -->
    <section class="toolbar">
      <div class="filters" id="filters">
        <!-- "Active" = Preparing + Ready, the orders that still need work -->
        <button class="filter active" data-filter="Active">Active</button>
        <button class="filter" data-filter="Preparing">Preparing</button>
        <button class="filter" data-filter="Ready">Ready</button>
        <button class="filter" data-filter="Delivered">Delivered</button>
        <button class="filter" data-filter="Cancelled">Cancelled</button>
        <button class="filter" data-filter="All">All</button>
      </div>
      <input type="search" id="searchOrders" placeholder="Search order, name or room" aria-label="Search orders">
    </section>
    <p class="updated" id="updated"></p>

    <!-- admin.js fills this with one card per order -->
    <section class="orders" id="orders"></section>
    <p class="empty" id="empty" hidden>No orders to show.</p>
    </div>

    <!-- ============ MESSAGES FROM STUDENTS (admin.js fills it) ============ -->
    <div id="messagesTab" hidden>
      <p class="updated">Messages from the contact page and the students' Messages window. Unanswered ones come first.</p>
      <section class="messages" id="messages"></section>
      <p class="empty" id="emptyMessages" hidden>No messages yet.</p>
    </div>

  </main>

  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
